<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Web Lead (Zoom Contact Center)</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #0B5CFF;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 16px;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    pre {
      margin-top: 12px;
      background: #f1f1f1;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <h1>Add Contact to "webleads"</h1>

  <div class="card">
    <form id="leadForm">
      <label>Full Name</label>
      <input id="name" required placeholder="Pat Example" />

      <label>Email</label>
      <input id="email" type="email" placeholder="pat@example.com" />

      <label>Phone (E.164 format)</label>
      <input id="phone" required placeholder="+447700900123" />

      <button type="submit">Add to Address Book</button>
    </form>

    <div id="status" class="status"></div>
    <pre id="response"></pre>
  </div>

<script>
  // =========================
  // 🔧 CHANGE THESE TWO VALUES
  // =========================
  const WORKER_BASE_URL = "https://eno-zoom-triggers.github-b13.workers.dev";
  const ADMIN_TOKEN = "CSTSyHD7vwNKxj9ZvaSk0Vr8GBl8rlqAw";

  const form = document.getElementById("leadForm");
  const statusDiv = document.getElementById("status");
  const responsePre = document.getElementById("response");

  function isE164(phone) {
    return /^\+\d{8,16}$/.test(phone.trim());
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    statusDiv.textContent = "";
    responsePre.textContent = "";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!isE164(phone)) {
      statusDiv.textContent = "Phone number must be in E.164 format (e.g. +447700900123)";
      statusDiv.className = "status error";
      return;
    }

    try {
      const response = await fetch(
        WORKER_BASE_URL + "/address-books/webleads/contacts",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(ADMIN_TOKEN ? { "X-Admin-Token": ADMIN_TOKEN } : {})
          },
          body: JSON.stringify({ name, email, phone })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        statusDiv.textContent = "Error adding contact.";
        statusDiv.className = "status error";
        responsePre.textContent = JSON.stringify(data, null, 2);
        return;
      }

      statusDiv.textContent = "Contact successfully added to webleads.";
      statusDiv.className = "status success";
      responsePre.textContent = JSON.stringify(data, null, 2);

      form.reset();

    } catch (err) {
      statusDiv.textContent = "Network error. Check Worker URL / CORS.";
      statusDiv.className = "status error";
      responsePre.textContent = err.toString();
    }
  });
</script>

</body>
</html>
